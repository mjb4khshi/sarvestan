<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sarvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="sarvLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="460" height="460" rx="115" x="26" y="26" fill="url(#sarvBg)" stroke="#10b981" stroke-width="8" stroke-opacity="0.4" />

  <!-- Cypress / Sarv Signature Curved Leaf -->
  <g filter="url(#glow)">
    <path d="M256 82 C100 240 160 430 256 430 C352 430 412 240 256 82 Z" fill="url(#sarvLeaf)" />
    <!-- Leaf Center Rib Spine -->
    <path d="M256 120 L256 415" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.3" />
  </g>
</svg>
