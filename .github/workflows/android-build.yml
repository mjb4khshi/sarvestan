name: Build & Release Sarvestan

on:
  push:
    branches: ["main", "master", "dev"]
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs, Extension & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (cached distribution)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Android Dependencies
        working-directory: sarvestan-android
        run: npm ci || npm install

      - name: Build Android Web Bundle
        working-directory: sarvestan-android
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: sarvestan-android
        run: npx cap sync android

      - name: Check Keystore Secrets
        id: secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Release Keystore
        if: steps.secrets.outputs.has_keystore == 'true'
        working-directory: sarvestan-android/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > keystore/ci-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/ci-release.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build Android Release APKs (Production & Preview)
        if: steps.secrets.outputs.has_keystore == 'true'
        working-directory: sarvestan-android/android
        run: |
          for i in 1 2 3; do
            gradle clean assembleProductionRelease assemblePreviewRelease --no-daemon && exit 0
            echo "gradle attempt $i failed; retrying..."
            sleep $((i * 15))
          done
          exit 1

      - name: Build Android Debug APKs (Fallback, No Secrets)
        if: steps.secrets.outputs.has_keystore == 'false'
        working-directory: sarvestan-android/android
        run: |
          for i in 1 2 3; do
            gradle clean assembleProductionDebug assemblePreviewDebug --no-daemon && exit 0
            echo "gradle attempt $i failed; retrying..."
            sleep $((i * 15))
          done
          exit 1

      - name: Collect Android APKs
        run: |
          mkdir -p dist-artifacts
          # Production APK
          if [ -f sarvestan-android/android/app/build/outputs/apk/production/release/app-production-release.apk ]; then
            cp sarvestan-android/android/app/build/outputs/apk/production/release/app-production-release.apk dist-artifacts/sarvestan.apk
          elif [ -f sarvestan-android/android/app/build/outputs/apk/production/debug/app-production-debug.apk ]; then
            cp sarvestan-android/android/app/build/outputs/apk/production/debug/app-production-debug.apk dist-artifacts/sarvestan.apk
          elif [ -f sarvestan-android/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp sarvestan-android/android/app/build/outputs/apk/release/app-release.apk dist-artifacts/sarvestan.apk
          fi

          # Preview APK
          if [ -f sarvestan-android/android/app/build/outputs/apk/preview/release/app-preview-release.apk ]; then
            cp sarvestan-android/android/app/build/outputs/apk/preview/release/app-preview-release.apk dist-artifacts/sarvestan-preview.apk
          elif [ -f sarvestan-android/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk ]; then
            cp sarvestan-android/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk dist-artifacts/sarvestan-preview.apk
          fi
          ls -la dist-artifacts/

      - name: Build Root Web & Package Extension ZIP
        run: |
          npm run build
          cd dist
          zip -r sarvestan-extension.zip . -x "sarvestan-extension.zip" "*.apk" "*.map"
          cd ..
          cp dist/sarvestan-extension.zip dist-artifacts/sarvestan-extension.zip
          ls -la dist-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sarvestan-release-bundle
          path: dist-artifacts/*
          if-no-files-found: error

      - name: Determine Version and Release Metadata
        id: release_meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=سروستان نگارش ${VERSION}" >> "$GITHUB_OUTPUT"
          if [ -f RELEASE_NOTES.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body_path: ${{ steps.release_meta.outputs.has_notes == 'true' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.release_meta.outputs.has_notes == 'false' }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist-artifacts/sarvestan.apk
            dist-artifacts/sarvestan-preview.apk
            dist-artifacts/sarvestan-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
